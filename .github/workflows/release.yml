name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary with target suffix
        run: |
          cp target/${{ matrix.target }}/release/wplab-lsp wplab-lsp-${{ matrix.target }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: wplab-lsp-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wplab-lsp-${{ matrix.target }}
          path: wplab-lsp-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: wplab-lsp-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: wplab-lsp ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform, rename to `wplab-lsp`, and place in your `PATH`:

            ```bash
            chmod +x wplab-lsp-<target>
            mv wplab-lsp-<target> /usr/local/bin/wplab-lsp
            ```

            | File | Platform |
            |------|----------|
            | `wplab-lsp-x86_64-unknown-linux-gnu` | Linux x86_64 |
            | `wplab-lsp-aarch64-unknown-linux-gnu` | Linux ARM64 |
            | `wplab-lsp-aarch64-apple-darwin` | macOS Apple Silicon |

            ### Verification

            ```bash
            gh attestation verify --owner ${{ github.repository_owner }} <file>
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
          files: artifacts/*
