[package]
name = "wplabs-lsp"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "wplabs-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.22"
tree-sitter-wfl = { git = "https://github.com/wp-labs/tree-sitter-wfl" }
tree-sitter-wfs = { git = "https://github.com/wp-labs/tree-sitter-wfs" }
tree-sitter-wpl = { git = "https://github.com/wp-labs/tree-sitter-wpl" }
tree-sitter-oml = { git = "https://github.com/wp-labs/tree-sitter-oml" }
tree-sitter-wfg = { git = "https://github.com/wp-labs/tree-sitter-wfg" }
tree-sitter-gxl= { git = "https://github.com/wp-labs/tree-sitter-gxl" }
lsp-types = "0.94"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
log = "0.4"
env_logger = "0.11"
